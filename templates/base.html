<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}DeepSearch Local{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('home') }}">DeepSearch Local</a>
      <nav aria-label="Main">
        <a href="{{ url_for('home') }}"{% if request.endpoint != 'evaluate_route' %} aria-current="page"{% endif %}>Search</a>
        <a href="{{ url_for('evaluate_route') }}"{% if request.endpoint == 'evaluate_route' %} aria-current="page"{% endif %}>Evaluation</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Your files and the search index stay on this computer.</footer>
</body>
</html>
